<!--
  File: 404.html
  Description: Custom 404 "Page Not Found" error page. It is designed to be self-contained and loads minimal resources to ensure it displays quickly and correctly, even if other site assets fail to load.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page introuvable.">
  <title>404 • Page introuvable</title>

  <!-- Applies the saved theme before first paint (prevents a flash of incorrect theme). -->
  <script src="/assets/js/core/theme-init.js"></script>

  <!-- Preconnect to external domains for faster resource loading. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- External stylesheets and favicon. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/error.css">
  <link rel="icon" href="/assets/img/logo_iut.png" type="image/png">


  <!-- SEO and caching directives. -->
  <meta name="robots" content="noindex"> <!-- Prevents search engines from indexing this page. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <!-- Accessibility link to skip to main content. -->
  <a href="#main" class="skip-link">Aller au contenu</a>

  <main id="main" class="error-page">
    <div class="error-icon" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="error-code">Erreur 404</div>
    <h1>Oups, page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <!-- Tips for the user to find what they were looking for. -->
    <ul class="tips">
      <li>Vérifiez l'adresse dans la barre d'URL.</li>
      <li>Utilisez le menu de navigation pour trouver votre contenu.</li>
      <li>Revenez à l'accueil ou consultez les actualités.</li>
    </ul>
    <!-- Action buttons to guide the user. -->
    <div class="actions">
      <a class="btn" href="/index.html"><i class="fa-solid fa-house"></i> Accueil</a>
    </div>
  </main>

  <footer style="text-align:center; padding:1rem; color:#888;">
    <!-- The privacy page link was removed from this footer. -->
  </footer>

  <script type="module" src="/assets/js/pages/error.js"></script>
</body>
</html>
