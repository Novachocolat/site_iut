<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style_crash.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Vous avez été Jinxé !</title>
</head>
<body>
    <div class="container">
        <div class="snif">:(</div>

        <h1>Vous avez été Jinxé !</h1>

        <p> Jinx a pris le contrôle de votre PC car vous avez oublié de le verrouiller lors de votre absence. </p>

        <p class="resolution">Résolu à 0%</p>

        <div class="infos">

    <img src="img/qrcode.png" alt="QR Code" loading="lazy" decoding="async">

        <p>Pour résoudre ce problème, vous devrez déposer une <strong>figurine de Jinx</strong> demain sur la table de Lysandre :D<br><br>
        ERROR CODE : <span class="error">JIN_XE</span>
        </p>

        </div>

    <img src="img/jinx.png" alt="Jinx" class="jinx-sprite" loading="lazy" decoding="async" fetchpriority="low">

    </div>
    <!-- Firebase (for maintenance guard) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/env.runtime.js"></script>
    <script src="js/common/firebase_init.js"></script>
    <script src="js/common/maintenance_guard.js"></script>
    <script src="js/common/nav.js"></script>
</body>
</html>
