<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion au Portail IUTLCO.">
  <title>Connexion • Portail IUT</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style_index.css">
  <link rel="icon" href="img/logo_iut.png" type="image/png">
  <style>
    .login-wrap{max-width:640px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
    .login-wrap section{padding:1.2rem 1rem}
    .login-actions{display:flex;gap:.6rem;flex-wrap:nowrap;flex-direction:column;align-items:stretch}
    .login-actions button{padding:.7rem 1rem;border-radius:10px;border:1px solid #bdbdbd;background:var(--card-bg);color:var(--text);cursor:pointer;transition:background .2s,box-shadow .2s}
    .login-actions button:hover{background:rgba(0,0,0,.06);box-shadow:var(--shadow)}
    .login-actions .logout{background:transparent;border-style:dashed}
    .muted{color:#546e7a}
    @media (min-width: 600px){
      .login-actions{flex-direction:row}
      .login-actions button{flex:1}
    }
  </style>
</head>
<body data-theme="light">
  <a href="#main" class="skip-link">Aller au contenu</a>
  <main id="main" class="login-wrap">
    <section>
      <h2><i class="fa-solid fa-user-shield"></i> Connexion</h2>
      <p class="muted">Connectez-vous pour accéder aux fonctions d'administration (Actualités, Messages).</p>
      <div class="login-actions">
        <button id="google-login" type="button"><i class="fa-brands fa-google"></i> Continuer avec Google</button>
        <button id="ms-login" type="button"><i class="fa-brands fa-microsoft"></i> Continuer avec Microsoft</button>
        <button id="logout-btn" class="logout" type="button"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button>
      </div>
      <p id="login-state" class="muted"></p>
    </section>
  </main>

  <footer>
    &copy; 2025 Portail IUT &nbsp;·&nbsp; <a href="privacy.html">Confidentialité &amp; cookies</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/env.runtime.js"></script>
  <script src="js/common/firebase_init.js"></script>
  <script src="js/common/maintenance_guard.js"></script>
  <script src="js/cookie_consent.js"></script>
  <script src="js/common/analytics.js"></script>
  <script src="js/common/auth.js"></script>
  <script src="js/common/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const state = document.getElementById('login-state');
      window.addEventListener('authchange', (e)=>{
        const u = e.detail && e.detail.user;
        const r = e.detail && e.detail.roles;
        if (u) {
          state.textContent = `Connecté en tant que ${u.displayName||u.email||u.uid} — Rôles: ${r && (r.admin?'admin ':'')}${r && (r.editor?'editor':'')}`;
        } else {
          state.textContent = 'Non connecté.';
        }
      });
    });
  </script>
</body>
</html>
