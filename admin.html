<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin • Portail IUT</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style_index.css">
  <link rel="icon" href="img/logo_iut.png" type="image/png">
  <style>
    .admin-wrap{max-width:1000px;margin:0 auto;padding:1rem;}
    .admin-note{color:#546e7a;margin:.5rem 0 1rem}
    form.admin {display:grid;grid-template-columns:1fr 1fr;gap: .75rem 1rem;margin:1rem 0}
    form.admin .full{grid-column:1/-1}
    form.admin input, form.admin textarea, form.admin select{width:100%;padding:.55rem .75rem;border:1px solid #bdbdbd;border-radius:8px;background:var(--bg);color:var(--text)}
    form.admin button{padding:.55rem .9rem;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    .list{margin-top:1rem}
    .list li{margin:.25rem 0;display:flex;gap:.5rem;align-items:center;justify-content:space-between}
    .list .meta{opacity:.7;font-size:.9rem}
  </style>
</head>
<body data-theme="light">
  <a href="#main" class="skip-link">Aller au contenu</a>
  <main id="main" class="admin-wrap">
    <section>
      <h2><i class="fa-solid fa-shield"></i> Administration</h2>
      <p class="admin-note">Vous devez être connecté avec un rôle éditeur ou admin pour modifier le contenu.</p>
      <div id="admin-guard" class="admin-guard">Vérification des droits…</div>
    </section>
    <section id="news-sec" style="display:none">
      <h3><i class="fa-regular fa-newspaper"></i> Actualités</h3>
      <form id="news-form" class="admin">
        <input type="hidden" id="news-id" />
        <div>
          <label for="news-title">Titre</label>
          <input id="news-title" required maxlength="120" />
        </div>
        <div>
          <label for="news-visible">Visible</label>
          <select id="news-visible"><option value="true">Oui</option><option value="false">Non</option></select>
        </div>
        <div>
          <label for="news-publish">Publication</label>
          <input id="news-publish" type="datetime-local" />
        </div>
        <div class="full">
          <label for="news-excerpt">Accroche</label>
          <input id="news-excerpt" maxlength="200" />
        </div>
        <div class="full">
          <label for="news-body">Contenu</label>
          <textarea id="news-body" rows="6" maxlength="5000"></textarea>
        </div>
        <div class="full">
          <button type="submit"><i class="fa-regular fa-floppy-disk"></i> Enregistrer</button>
          <button type="button" id="news-reset" style="margin-left:.5rem;background:#546e7a"><i class="fa-regular fa-file"></i> Nouveau</button>
        </div>
        <p id="news-status"></p>
      </form>
      <ul id="news-list" class="list"></ul>
    </section>
    <section id="contact-sec" style="display:none">
      <h3><i class="fa-regular fa-envelope"></i> Messages de contact</h3>
      <ul id="contact-list" class="list"></ul>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/env.runtime.js"></script>
  <script src="js/common/firebase_init.js"></script>
  <script src="js/common/maintenance_guard.js"></script>
  <script src="js/cookie_consent.js"></script>
  <script src="js/common/analytics.js"></script>
  <script src="js/common/auth.js"></script>
  <script src="js/common/nav.js"></script>
  <script src="js/admin/admin.js"></script>
</body>
</html>
