server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static files are re-read on every request, no caching while testing.
  add_header Cache-Control "no-store";

  # Custom error pages (served from the site root).
  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
