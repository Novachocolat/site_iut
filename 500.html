<!--
  File: 500.html
  Description: Custom 500 "Internal Server Error" page. Like the 404 page, it is designed to be self-contained and minimalistic to ensure it can be rendered reliably when the server encounters a problem.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erreur interne du serveur.">
  <title>500 • Erreur serveur</title>

  <!--
    Inline script for early theme synchronization to prevent a "flash of incorrect theme."
    It reads the user's preferred theme from localStorage and applies it before rendering.
  -->
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        // Fallback to 'light' theme if localStorage is unavailable.
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Preconnect to external domains for faster resource loading. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- External stylesheets and favicon. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style_index.css?v=2">
  <link rel="icon" href="img/logo_iut.png" type="image/png">

  <!--
    Scoped inline styles for the error page layout.
    This ensures the page displays correctly even if the main stylesheet is unavailable.
  -->
  <style>
    .error-page { max-width: 800px; margin: 3.5rem auto 2rem; background: var(--card-bg, #fff); border-radius: var(--radius, 12px); box-shadow: var(--shadow, 0 10px 30px rgba(0,0,0,.08)); padding: 2rem 2rem 2.25rem; text-align: center; }
    .error-code { font-weight: 700; font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground, #64748b); margin-bottom: .25rem; }
    .error-icon { width: 80px; height: 80px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--muted, #f1f5f9); color: var(--primary, #2563eb); margin: -60px auto 1rem; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .error-icon i { font-size: 36px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .75rem 1rem; border-radius: var(--radius, 12px); text-decoration: none; background: var(--primary, #2563eb); color: #fff; border: 1px solid transparent; }
    .btn.secondary { background: transparent; color: var(--primary, #2563eb); border-color: var(--card-border, #e5e7eb); }
    .tips { max-width: 560px; margin: 1rem auto 0; text-align: left; color: var(--muted-foreground, #64748b); }
    .tips li { margin: .25rem 0; }
  </style>

  <!-- SEO and caching directives. -->
  <meta name="robots" content="noindex"> <!-- Prevents search engines from indexing this page. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <!-- Accessibility link to skip to main content. -->
  <a href="#main" class="skip-link">Aller au contenu</a>

  <main id="main" class="error-page">
    <div class="error-icon" aria-hidden="true"><i class="fa-solid fa-bug"></i></div>
    <div class="error-code">Erreur 500</div>
    <h1>Une erreur s'est produite</h1>
    <p>Le serveur a rencontré un problème. Réessayez dans un instant ou revenez à l'accueil.</p>
    <!-- Tips for the user to resolve the issue. -->
    <ul class="tips">
      <li>Si le problème persiste, contactez-nous via le formulaire.</li>
      <li>Vous pouvez aussi revenir à l'accueil.</li>
    </ul>
    <!-- Action buttons to allow the user to retry or go back to the homepage. -->
    <div class="actions">
      <button class="btn" type="button" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Réessayer</button>
      <a class="btn secondary" href="index.html"><i class="fa-solid fa-house"></i> Accueil</a>
    </div>
  </main>

  <footer style="text-align:center; padding:1rem; color:#888;">
    <!-- The privacy page link was removed from this footer. -->
  </footer>

  <!-- Common scripts -->
  <script src="js/common/maintenance_guard.js"></script> <!-- Maintenance mode check -->
  <script src="js/common/nav.js?v=2"></script> <!-- Global navigation -->

  <!--
    Inline script to improve accessibility by focusing the main content area on load.
  -->
  <script>
    window.addEventListener('load', () => {
      var mainContent = document.getElementById('main');
      if (mainContent) {
        mainContent.setAttribute('tabindex', '-1');
        mainContent.focus({ preventScroll: true });
      }
    });
  </script>
</body>
</html>
