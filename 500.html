<!--
  File: 500.html
  Description: Custom 500 "Internal Server Error" page. Like the 404 page, it is designed to be self-contained and minimalistic to ensure it can be rendered reliably when the server encounters a problem.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erreur interne du serveur.">
  <title>500 • Erreur serveur</title>

  <!-- Applies the saved theme before first paint (prevents a flash of incorrect theme). -->
  <script src="/assets/js/core/theme-init.js"></script>

  <!-- Preconnect to external domains for faster resource loading. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- External stylesheets and favicon. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/error.css">
  <link rel="icon" href="/assets/img/logo_iut.png" type="image/png">


  <!-- SEO and caching directives. -->
  <meta name="robots" content="noindex"> <!-- Prevents search engines from indexing this page. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <!-- Accessibility link to skip to main content. -->
  <a href="#main" class="skip-link">Aller au contenu</a>

  <main id="main" class="error-page">
    <div class="error-icon" aria-hidden="true"><i class="fa-solid fa-bug"></i></div>
    <div class="error-code">Erreur 500</div>
    <h1>Une erreur s'est produite</h1>
    <p>Le serveur a rencontré un problème. Réessayez dans un instant ou revenez à l'accueil.</p>
    <!-- Tips for the user to resolve the issue. -->
    <ul class="tips">
      <li>Si le problème persiste, contactez-nous via le formulaire.</li>
      <li>Vous pouvez aussi revenir à l'accueil.</li>
    </ul>
    <!-- Action buttons to allow the user to retry or go back to the homepage. -->
    <div class="actions">
      <button class="btn" type="button" data-action="reload"><i class="fa-solid fa-rotate-right"></i> Réessayer</button>
      <a class="btn secondary" href="/index.html"><i class="fa-solid fa-house"></i> Accueil</a>
    </div>
  </main>

  <footer style="text-align:center; padding:1rem; color:#888;">
    <!-- The privacy page link was removed from this footer. -->
  </footer>

  <script type="module" src="/assets/js/pages/error.js"></script>
</body>
</html>
